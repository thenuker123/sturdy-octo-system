<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Portal Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; padding: 40px 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 2.5rem; color: #f0f6fc; margin-bottom: 10px; text-align: center; }
        p.subtitle { text-align: center; color: #8b949e; margin-bottom: 40px; }
        
        /* Grid Layout */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px 20px; text-align: center; cursor: pointer; transition: all 0.2s ease; }
        .card:hover { transform: translateY(-5px); border-color: #58a6ff; background: #1f242c; }
        .card-icon { font-size: 2.5rem; margin-bottom: 15px; }
        .card-title { font-size: 1.2rem; font-weight: 600; color: #f0f6fc; margin-bottom: 5px; text-transform: capitalize; }
        .card-desc { font-size: 0.85rem; color: #8b949e; }
        
        /* Loading & Error States */
        .status-msg { text-align: center; font-size: 1.2rem; color: #8b949e; grid-column: 1 / -1; padding: 40px; }

        /* Modal Overlay for Games */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { position: relative; width: 90%; height: 85%; max-width: 1000px; background: #000; border-radius: 16px; border: 1px solid #30363d; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .close-btn { position: fixed; top: 20px; right: 30px; font-size: 2.5rem; color: #fff; cursor: pointer; background: none; border: none; font-weight: bold; z-index: 1001; }
        .close-btn:hover { color: #ff7b72; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Game Vault</h1>
        <p class="subtitle">Dynamically loading live folders directly from @thenuker123.</p>
        
        <!-- The auto-generated grid -->
        <div class="grid" id="game-grid">
            <div class="status-msg">Scanning repositories for games...</div>
        </div>
    </div>

    <!-- Hidden Game Player Modal -->
    <div class="modal" id="gameModal">
        <button class="close-btn" onclick="closeGame()">&times;</button>
        <div class="modal-content">
            <iframe id="gameFrame" src=""></iframe>
        </div>
    </div>

    <script>
        // Configured with your exact username
        const GITHUB_USERNAME = "thenuker123"; 

        async function fetchGames() {
            const grid = document.getElementById('game-grid');
            try {
                // Fetch public repositories from the GitHub API
                const response = await fetch(`https://github.com{GITHUB_USERNAME}/repos?per_page=100&sort=updated`);
                
                if (!response.ok) throw new Error("Could not connect to GitHub API");
                const repos = await response.json();

                // Filters: Requires active Pages deployment, excludes your main landing site
                const gameRepos = repos.filter(repo => 
                    repo.has_pages && 
                    repo.name.toLowerCase() !== `${GITHUB_USERNAME}.github.io`
                );

                if (gameRepos.length === 0) {
                    grid.innerHTML = `<div class="status-msg">No active game forks found.<br><br><span style="font-size: 0.95rem; color: #8b949e;">Make sure your forked repos have <b>GitHub Pages</b> turned ON inside their Settings tab!</span></div>`;
                    return;
                }

                // Clear out loading status
                grid.innerHTML = "";

                // Generate a dashboard element for every project match
                gameRepos.forEach(repo => {
                    const cleanName = repo.name.replace(/[-_]/g, ' '); 
                    const liveGameUrl = `https://${GITHUB_USERNAME}.github.io/${repo.name}/`;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.setAttribute('onclick', `openGame('${liveGameUrl}')`);
                    
                    card.innerHTML = `
                        <div class="card-icon">🕹️</div>
                        <div class="card-title">${cleanName}</div>
                        <div class="card-desc">${repo.description || 'Click to launch application'}</div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="status-msg" style="color: #ff7b72;">Failed to load. Please verify connection to GitHub.</div>`;
            }
        }

        // Modal triggers
        function openGame(url) {
            document.getElementById('gameFrame').src = url;
            document.getElementById('gameModal').style.display = 'flex';
        }

        function closeGame() {
            document.getElementById('gameModal').style.display = 'none';
            document.getElementById('gameFrame').src = ""; // Instantly wipes memory and halts game sounds
        }

        // Initialize script
        fetchGames();
    </script>
</body>
</html>
